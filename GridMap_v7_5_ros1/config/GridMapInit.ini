# LM,HM,New_LM
choose_car	HM
# LM Lidar Type(0:Points 1:Points_tztek)
LM_Lidar_Type	1

# image开关
b_show_camera_front 		0	#是否显示原始相机图像
b_show_undistort 		0	#是否显示相机去畸变后的图像
b_show_proj			0	#是否显示投影图像
f_show_bev_color		0	#是否显示lidar bev，0:not 1:only color points 2:all points
b_show_rgb_map			0	#是否显示RGB Map
b_gridmap_use_rgb    		0    	# GridMap颜色模式：0=高度着色，1=RGB着色
b_show_height_diff 		0	#控制高度差图显示
b_show_slope_map 		0	#控制坡度图显示
b_show_terrain_roughness 	0	#发布地形粗糙度显示
b_show_terrain_slope 		0	#发布地形坡度显示
b_show_terrain_labels 		0	#发布地形标签显示
b_show_colormap_vehicle 	0	#发布车体坐标系颜色地图显示
b_show_obstacle_detection 	0	#控制障碍物检测可视化显示
b_show_lidar_points 		0	#控制激光雷达点云可视化显示

# GridMap处理参数
b_enable_point_z_filter 	0	#是否过滤超过point_z_max的点，0=不过滤高度
point_z_max 			2.5	#点云高度过滤上限，仅b_enable_point_z_filter=1生效
terrain_roughness_scale 	2.5	#TerrainMap roughness归一化尺度，单位m

# LiDAR BEV surface map
b_enable_lidar_bev			1	#是否发布LiDAR BEV多层表面图
b_lidar_bev_use_odometry		1	#兼容旧参数，优先使用lidar_bev_pose_source
b_lidar_bev_use_ransac_ground		1	#1=RANSAC地面分割，0=近场低分位回退
b_show_lidar_bev_layers		1	#是否弹出H_rel_surf/M_L/G_long_L/G_lat_L窗口
lidar_bev_pose_source			localpose	#localpose/odometry/body
lidar_odometry_topic			/sensor/Odometry
lidar_bev_topic				/lidar_bev/grid_map
lidar_bev_frame_id			map
lidar_bev_body_frame_id			body
lidar_bev_resolution			0.2
lidar_bev_map_size_x			64.0
lidar_bev_map_size_y			64.0
lidar_bev_point_min_z			-10.0
lidar_bev_point_max_z			200.0
lidar_bev_update_rate_hz		10.0	#LiDAR BEV构建/发布/窗口刷新频率，<=0表示不限频
b_lidar_bev_enable_ego_filter		1	#是否在多帧累计前剔除自车XY范围内点云
lidar_bev_ego_box_min_x		-3.0	#累计前点云剔除x下限，车体坐标系，m
lidar_bev_ego_box_max_x		1.0	#累计前点云剔除x上限，车体坐标系，m
lidar_bev_ego_box_min_y		-1	#累计前点云剔除y下限，车体坐标系，m
lidar_bev_ego_box_max_y		1	#累计前点云剔除y上0限，车体坐标系，m
lidar_bev_near_inner_radius		2.0
lidar_bev_near_outer_radius		3.0
lidar_bev_ground_candidate_min_z	-2.5
lidar_bev_ground_candidate_max_z	-1.0    
lidar_bev_ground_ransac_distance	0.18
lidar_bev_ground_max_plane_tilt_deg	25.0
lidar_bev_ground_fallback_quantile	0.35
lidar_bev_ground_min_points		30
lidar_bev_height_quantile		1.0
lidar_bev_cell_max_points		80	#每个BEV栅格最多保留的最新累计点数，0表示不限制
lidar_bev_debug_window_stride		2	#BEV调试窗口每N次构建刷新一次，1表示每帧刷新
lidar_bev_edge_min_valid_neighbors	5	#3x3内最少有效邻居数





# camera calib
LM_camera_calib_file1      config/Calib/LM/AR0231-Front.ini
