input_topic: "/cloud_registered_body"
odometry_topic: "/Odometry"
output_topic: "/lidar_bev/grid_map"
use_odometry_frame: true
use_ransac_ground: true
odometry_frame_id: "camera_init"
body_frame_id: "body"

resolution: 0.2
map_size_x: 100.0
map_size_y: 100.0
point_min_z: -5.0
point_max_z: 80.0
update_rate_hz: 10.0

ego_filter_enabled: true
ego_box_min_x: -2.0
ego_box_max_x: 2.0
ego_box_min_y: -2.0
ego_box_max_y: 2.0

near_inner_radius: 2.0
near_outer_radius: 15.0
ground_candidate_min_z: -3.0
ground_candidate_max_z: 1.0
ground_ransac_distance: 0.18
ground_max_plane_tilt_deg: 25.0
ground_fallback_quantile: 0.35
ground_min_points: 30

height_quantile: 0.90
accumulation_frame_count: 5
count_saturation: 8
distance_decay_alpha: 0.02

edge_gradient_threshold: 1.0
edge_min_height: 0.45
edge_min_jump: 0.5
edge_min_valid_neighbors: 4

show_windows: true
