# ROS topics and frames.
input_topic: "/cloud_registered_body"
odometry_topic: "/Odometry"
output_topic: "/lidar_bev/grid_map"
use_odometry_frame: true
odometry_frame_id: "camera_init"
body_frame_id: "body"
update_rate_hz: 10.0
show_windows: false

# BEV geometry.
resolution: 0.2
map_size_x: 64.0
map_size_y: 64.0
point_min_z: -100.0
point_max_z: 200.0

# Ego vehicle filtering in body frame.
ego_filter_enabled: true
ego_box_min_x: -3.0
ego_box_max_x: 2.0
ego_box_min_y: -1.0
ego_box_max_y: 1.0

# Ground reference estimation.
use_ransac_ground: true
near_inner_radius: 3.0
near_outer_radius: 7.0
ground_candidate_min_z: -5.0
ground_candidate_max_z: 5.0
ground_ransac_distance: 0.18
ground_max_plane_tilt_deg: 25.0
ground_front_half_angle_deg: 15.0
ground_require_forward: true
ground_failure_fallback_z: 0.0
ground_min_points: 50

# Height and gradient layers.
surface_top_height_fraction: 0.15
height_quantile: 0.90
h_rel_deadzone_half_width: 0.20
grad_deadzone_half_width: 0.15
grad_cap: 0.0
edge_min_valid_neighbors: 5

# History and confidence.
cell_max_points: 0
accumulation_frame_count: 0
count_saturation: 8
distance_decay_alpha: 0.02

# Optional smoothing filters.
enable_temporal_height_filter: false
temporal_height_alpha: 0.35
temporal_height_max_jump: 0.35
enable_spatial_height_smoothing: false
height_smoothing_radius: 2
height_smoothing_max_delta: 0.35
height_smoothing_min_neighbors: 3

# Debug display.
debug_window_stride: 2
