# LiDAR relative-height BEV + DSM particle filter localization config.
# ROS private parameters with the same key names override values in this file.

[paths]
gridmap_init_path = /home/hsw/catkin_ws/program/GridMap_v7_5_ros1/config/GridMapInit.ini
dem_path = /home/hsw/catkin_ws/doc/miluo_dsm.tif

[topics]
lidar_bev_topic = /lidar_bev/grid_map
localpose_topic = /self_state/LocalPose
globalpose_topic = /self_state/GlobalPose
particles_topic = /pf_particles
pose_topic = /pf_pose
cost_topic = /pf_height_cost
output_frame_id = map

[grid_map_layers]
height_layer = H_rel_surf
mask_layer = M_L
height_layer_fallbacks = H_L,H_clean
mask_layer_fallbacks = M_obs

[particle_filter]
num_particles = 512
init_std_x = 5.0
init_std_y = 5.0
init_std_theta_deg = 10.0
motion_noise_x = 0.10
motion_noise_y = 0.10
motion_noise_theta_deg = 1.0
resample_threshold_ratio = 0.5
particle_batch_size = 64
initialize_from_global = true

[dsm]
terrain_resolution = 0.2
dsm_reference_radius_m = 2.0
dsm_min_valid_ratio = 0.8
invalid_dsm_cost = 1000.0
use_gpu = true

[height_score]
height_percentile = 98.0
ground_eps = 0.20
hmax_min_valid_count = 50
hmax_default = 5.0
hmax_min = 5.0
hmax_max = 40.0
lambda_lidar_higher = 1.0
lambda_dsm_higher = 0.3
huber_delta = 0.20
score_tau = 0.20
score_eps = 1e-6
min_obs_cells = 50

[pose]
local_heading_unit = deg
global_heading_unit = deg
global_heading_convention = azimuth
localpose_delta_mode = odom_frame
local_pose_track_mode = anchor

[runtime]
rate = 30.0
show_window = true
track_window_width = 800
track_window_height = 800
print_every_n = 1
