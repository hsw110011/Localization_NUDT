[particle_filter]
enable = true
num_particles = 256
random_seed = 42
device = cuda:0

# 首帧 GlobalPose（卫星/GNSS）周围高斯初始化，单位：x/y 米，yaw 弧度
init_std_x = 8.0
init_std_y = 8.0
init_std_yaw = 0.10

# 运动噪声系数（线性）：std = coeff * |里程计增量|
#   std_x = motion_std_x * |delta_x|,  std_y = motion_std_y * |delta_y|
#   std_yaw = motion_std_yaw * |delta_yaw|
motion_std_x = 0.30
motion_std_y = 0.15
motion_std_yaw = 0.01

score_is_cost = true
score_temperature = 0.5
estimate_mode = elite_mean
elite_top_fraction = 0.15
nan_score_penalty = 1e6
min_valid_weight_sum = 1e-12

resample_threshold = 0.5
enable_roughening = true
roughening_std_x = 0.02
roughening_std_y = 0.02
roughening_std_yaw = 0.002

save_debug = true
save_particle_csv = false
save_score_csv = true
debug_dir = output/particle_filter_debug
pf_update_every_n = 1
pf_log_every_n = 10

[topics]
pf_pose_topic = /pf_global_pose
