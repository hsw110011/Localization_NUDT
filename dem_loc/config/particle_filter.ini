[particle_filter]
enable = true
num_particles = 256
random_seed = 42
device = cuda:0

# 首帧 GlobalPose（卫星/GNSS）周围高斯初始化，单位：x/y 米，yaw 弧度
init_std_x = 8.0
init_std_y = 8.0
init_std_yaw = 0.10

# 运动噪声系数（线性）：纵向按局部 x 位移扩散；横向按局部 y 位移 + 0.5 * 局部 x 位移扩散
#   std_x = motion_std_x * |delta_x|,  std_y = motion_std_y * (|delta_y| + 0.5 * |delta_x|)
#   std_yaw = motion_std_yaw * |delta_yaw|
#   std_yaw = motion_std_yaw * |delta_yaw|  （旋转时减小该系数可收紧航向扩散）
# LocalPose.vehicle_speed <= stationary_speed_threshold 时跳过 PF 传播和 BEV 观测更新
# 运动传播噪声额外乘以: 1 + motion_speed_noise_gain * |vehicle_speed|
motion_std_x = 0.25
motion_std_y = 0.25
motion_std_yaw = 0.008
stationary_speed_threshold = 0.05
motion_speed_noise_gain = 0.10

score_is_cost = true
score_temperature = 0.5
# 粒子权重区分度：
#   absolute: 旧逻辑，scale = score_tau * score_temperature
#   adaptive: 按当前帧粒子 J_total 的 p90-p10 spread 自适应设置 scale，
#             让粒子间已有的分数差异更明显地反映到权重里
weight_contrast_mode = absolute
weight_contrast_target_log_range = 2.0
weight_contrast_min_j_spread = 1e-4
weight_contrast_max_sharpen = 8.0
estimate_mode = elite_weighted
elite_top_fraction = 0.80
nan_score_penalty = 1e6
min_valid_weight_sum = 1e-12

# 有效粒子数低于 num_particles * resample_threshold 才重采样。
# 0.50 表示 256 粒子时 neff < 128 触发。
resample_threshold = 0.50
enable_roughening = true
roughening_std_x = 0.30
roughening_std_y = 0.30
roughening_std_yaw = 0.003

save_debug = true
save_particle_csv = false
save_score_csv = true
save_weight_vis = true
weight_vis_every_n = 1
weight_vis_dir = pf_weight_vis
debug_dir = output/particle_filter_debug
pf_update_every_n = 1
pf_log_every_n = 10

[dsm_bev_score]
# J_total = alpha_h * J_h + alpha_gx * J_gx + alpha_gy * J_gy
# 恢复 DSM-BEV 原始比例。
alpha_h = 0.65
alpha_gx = 0.25
alpha_gy = 0.10

[topics]
pf_pose_topic = /pf_global_pose
