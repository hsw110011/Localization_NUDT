[topics]
localpose_topic = /localpose
globalpose_topic = /globalpose
lidar_bev_topic = /lidar_bev/grid_map

[frames]
output_frame_id = map

[initial_pose]
use_globalpose_init = true
init_x = 0.0
init_y = 0.0
init_theta_deg = 0.0
global_heading_convention = azimuth
global_heading_unit = deg
local_heading_unit = deg
localpose_delta_mode = odom_frame

[particle_filter]
num_particles = 512
init_std_x = 5.0
init_std_y = 5.0
init_std_theta_deg = 10.0
motion_noise_x = 0.15
motion_noise_y = 0.10
motion_noise_theta_deg = 1.0
resample_threshold_ratio = 0.5
min_effective_particles_ratio = 0.5
random_seed = 0

[observation]
score_tau = 0.20
max_cost = 10.0

[output]
pf_pose_topic = /pf_pose
pf_particles_topic = /pf_particles
pf_path_topic = /pf_path
save_trajectory = true
trajectory_path = dem_loc/output/pf_trajectory.csv
save_debug = true
debug_dir = dem_loc/output/debug
show_plot = false
plot_update_interval = 10
publish_particles = true
publish_path = true

[runtime]
rate = 30.0
